<script>
    // Affiche les champs entreprise seulement quand le rôle « Client entreprise » est choisi.
    (function () {
        const role = document.getElementById("id_role");
        if (!role) return;

        function majChampsEntreprise() {
            const entreprise = role.value === "COMPANY";
            ["bloc-company_name", "bloc-company_description"].forEach(function (id) {
                const bloc = document.getElementById(id);
                if (bloc) bloc.style.display = entreprise || bloc.classList.contains("has-error") ? "" : "none";
            });
        }

        role.addEventListener("change", majChampsEntreprise);
        majChampsEntreprise();
    })();
</script>
