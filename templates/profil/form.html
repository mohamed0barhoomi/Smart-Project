{% extends "base.html" %}
{% block title %}Modifier mon profil{% endblock %}
{% block content %}
<nav class="breadcrumb" aria-label="Fil d'Ariane">
    <a href="{% url 'utilisateur:profil' %}">Mon profil</a><span class="sep">/</span><span aria-current="page">Modifier</span>
</nav>
<div class="page-head">
    <div>
        <span class="eyebrow">Mon compte</span>
        <h1>Modifier mes informations</h1>
    </div>
</div>

<form method="post" class="panel" novalidate>
    {% csrf_token %}
    <div class="panel-body">
        {% include "partials/form_fields_ext.html" %}
    </div>
    <div class="panel-foot">
        <a href="{% url 'utilisateur:profil' %}" class="btn btn-secondary">Annuler</a>
        <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </div>
</form>
{% endblock %}
