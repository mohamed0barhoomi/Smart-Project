<div class="toasts" id="toasts" aria-live="polite">
  {% for message in messages %}
    <div class="toast toast-{{ message.tags|default:'info' }}" data-autohide>
      {% if message.tags == "error" %}{% include "components/_icon.html" with name="alert" %}{% else %}{% include "components/_icon.html" with name="check" %}{% endif %}
      <span>{{ message }}</span>
      <button type="button" class="toast-close" aria-label="Close">{% include "components/_icon.html" with name="x" %}</button>
    </div>
  {% endfor %}
</div>
