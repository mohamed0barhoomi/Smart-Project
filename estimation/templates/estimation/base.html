<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion de projets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Gestion de projets</a>
    {% if user.is_authenticated %}
    <form method="POST" action="{% url 'deconnexion' %}" class="d-flex align-items-center gap-3">
      {% csrf_token %}
      <span class="text-white">👤 {{ user.username }}</span>
      <button class="btn btn-sm btn-outline-light">Déconnexion</button>
    </form>
    {% endif %}
  </div>
</nav>

<div class="container pb-5">
  {% for m in messages %}
    {# m.tags vaut success, error, warning... ("error" -> classe Bootstrap "danger") #}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags|default:'info' }}{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
